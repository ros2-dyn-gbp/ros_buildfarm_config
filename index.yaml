%YAML 1.1
# ROS buildfarm index file
---
distributions:
  rolling:
    release_builds:
      fedora: rolling/release-fedora-build.yaml
      rhel: rolling/release-rhel-build.yaml
jenkins_url: https://build.test.ros2.org
prerequisites:
  debian_repositories:
  - http://repo.test.ros2.org/ubuntu/building
  debian_repository_keys:
  - ''
rosdistro_index_url: https://raw.githubusercontent.com/ros2-dyn-gbp/rosdistro/master/index-v4.yaml
status_page_repositories:
  default:
  - http://repo.test.ros2.org/ubuntu/building
  - http://repo.test.ros2.org/ubuntu/testing
  - http://repo.test.ros2.org/ubuntu/main
  rhel:
  - http://repo.test.ros2.org/rhel/building
  - http://repo.test.ros2.org/rhel/testing
  - http://repo.test.ros2.org/rhel/main
type: buildfarm
version: 1
